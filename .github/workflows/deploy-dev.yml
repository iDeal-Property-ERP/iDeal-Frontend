name: Deploy (Development)

on:
  push:
    branches: [development]
  repository_dispatch:
    types: [trigger-deploy]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-development
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: development
    env:
      LOCATION: ${{ secrets.LOCATION }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USERNAME }}
      DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euxo pipefail

            cd "$LOCATION"

            git fetch origin --prune

            git checkout "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            git clean -fd

            IMAGE_TAG="${{ github.sha }}" docker compose up -d --build

            healthy=0
            for _ in $(seq 1 36); do
              if docker compose exec -T web node -e "fetch('http://localhost:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                healthy=1
                break
              fi
              sleep 5
            done
            if [ "$healthy" -ne 1 ]; then
              echo "Readiness probe failed"
              exit 1
            fi
