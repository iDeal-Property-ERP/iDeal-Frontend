services:
  web:
    container_name: 'ideal-frontend-prod'
    image: ideal-frontend-prod:latest
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:${APP_PORT}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - network-default
    restart: unless-stopped
    env_file:
      - .env

networks:
  network-default:
    name: ideal-prod-net
    external: true
