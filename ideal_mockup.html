<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Makon — Property Management Platform</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --navy: #0b1622;
        --navy2: #11202f;
        --navy3: #16293b;
        --navy4: #1d3650;
        --teal: #00d1a7;
        --teal2: #00b391;
        --tealfade: rgba(0, 209, 167, 0.12);
        --gold: #ffc94d;
        --goldfade: rgba(255, 201, 77, 0.12);
        --red: #ff5e62;
        --redfade: rgba(255, 94, 98, 0.12);
        --blue: #52a8ff;
        --bluefade: rgba(82, 168, 255, 0.12);
        --purple: #a78bfa;
        --purplefade: rgba(167, 139, 250, 0.12);
        --green: #34d399;
        --greenfade: rgba(52, 211, 153, 0.12);
        --text: #eaf2fb;
        --text2: #93a8c0;
        --text3: #5c748f;
        --border: rgba(255, 255, 255, 0.06);
        --border2: rgba(255, 255, 255, 0.11);
        --card: rgba(255, 255, 255, 0.035);
        --card2: rgba(255, 255, 255, 0.06);
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
        --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
        --radius: 14px;
        --radius-sm: 10px;
        --radius-lg: 20px;
      }
      body {
        background: var(--navy);
        color: var(--text);
        font-family: 'DM Sans', sans-serif;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      h4,
      .fd {
        font-family: 'Syne', sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 4px;
      }

      /* TOP NAV */
      .topnav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 22px;
        background: rgba(17, 32, 47, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 200;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-mark {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--teal), var(--teal2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Syne';
        font-weight: 800;
        color: var(--navy);
        font-size: 18px;
        box-shadow: 0 0 20px rgba(0, 209, 167, 0.4);
      }
      .brand-name {
        font-family: 'Syne';
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .brand-sub {
        font-size: 11px;
        color: var(--text3);
        margin-left: 4px;
        font-weight: 400;
      }
      .role-tabs {
        display: flex;
        gap: 3px;
        background: var(--navy);
        padding: 4px;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      .role-tab {
        padding: 8px 14px;
        border-radius: 9px;
        border: none;
        background: transparent;
        color: var(--text2);
        font-family: 'DM Sans';
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .role-tab.active {
        background: linear-gradient(135deg, var(--teal), var(--teal2));
        color: var(--navy);
        font-weight: 700;
        box-shadow: 0 2px 12px rgba(0, 209, 167, 0.3);
      }
      .role-tab:hover:not(.active) {
        background: var(--card2);
        color: var(--text);
      }
      .demo-pill {
        background: var(--goldfade);
        color: var(--gold);
        font-size: 10.5px;
        font-weight: 700;
        padding: 5px 11px;
        border-radius: 20px;
        border: 1px solid rgba(255, 201, 77, 0.3);
        font-family: 'Syne';
        letter-spacing: 0.5px;
      }

      /* LAYOUT */
      .shell {
        display: flex;
        min-height: calc(100vh - 61px);
      }
      .sidebar {
        width: 230px;
        background: var(--navy2);
        border-right: 1px solid var(--border);
        padding: 18px 12px;
        flex-shrink: 0;
        overflow-y: auto;
      }
      .content {
        flex: 1;
        padding: 26px 30px;
        overflow-y: auto;
        max-width: 100%;
      }
      .view {
        animation: fadein 0.25s ease;
      }
      @keyframes fadein {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* SIDEBAR */
      .nav-sec {
        margin-bottom: 22px;
      }
      .nav-sec-t {
        font-size: 10px;
        font-weight: 700;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 1.2px;
        padding: 0 12px;
        margin-bottom: 8px;
        font-family: 'Syne';
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
        color: var(--text2);
        font-size: 13px;
        font-weight: 500;
        transition: all 0.15s;
        margin-bottom: 2px;
        position: relative;
      }
      .nav-item:hover {
        background: var(--card2);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--tealfade);
        color: var(--teal);
        font-weight: 600;
      }
      .nav-item.active::before {
        content: '';
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 3px;
        background: var(--teal);
        border-radius: 2px;
      }
      .nav-ic {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }
      .nav-badge {
        margin-left: auto;
        background: var(--red);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 10px;
      }

      /* HEADINGS */
      .page-title {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.6px;
        margin-bottom: 3px;
      }
      .page-sub {
        font-size: 13.5px;
        color: var(--text2);
        margin-bottom: 24px;
      }
      .sec-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 26px 0 14px;
      }
      .sec-title {
        font-size: 15px;
        font-weight: 700;
        font-family: 'Syne';
      }
      .sec-title-sm {
        font-size: 11px;
        color: var(--text3);
        font-weight: 500;
        margin-top: 2px;
      }

      /* WELCOME BANNER */
      .welcome {
        background: linear-gradient(120deg, var(--navy3), var(--navy2));
        border: 1px solid var(--border2);
        border-radius: var(--radius-lg);
        padding: 24px 28px;
        margin-bottom: 26px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: relative;
        overflow: hidden;
        box-shadow: var(--shadow-md);
      }
      .welcome::after {
        content: '';
        position: absolute;
        right: -40px;
        top: -40px;
        width: 200px;
        height: 200px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--tealfade), transparent 70%);
      }
      .welcome h2 {
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 5px;
      }
      .welcome p {
        font-size: 13.5px;
        color: var(--text2);
      }
      .welcome-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--tealfade);
        color: var(--teal);
        font-size: 12px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 20px;
        margin-top: 10px;
        border: 1px solid rgba(0, 209, 167, 0.2);
      }

      /* STATS */
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 8px;
      }
      .stat {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px 20px;
        position: relative;
        overflow: hidden;
        transition: all 0.2s;
        box-shadow: var(--shadow-sm);
      }
      .stat:hover {
        border-color: var(--border2);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }
      .stat::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        opacity: 0.8;
      }
      .stat.teal::before {
        background: linear-gradient(90deg, var(--teal), transparent);
      }
      .stat.gold::before {
        background: linear-gradient(90deg, var(--gold), transparent);
      }
      .stat.blue::before {
        background: linear-gradient(90deg, var(--blue), transparent);
      }
      .stat.red::before {
        background: linear-gradient(90deg, var(--red), transparent);
      }
      .stat.purple::before {
        background: linear-gradient(90deg, var(--purple), transparent);
      }
      .stat-ic {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
      }
      .stat.teal .stat-ic {
        background: var(--tealfade);
        color: var(--teal);
      }
      .stat.gold .stat-ic {
        background: var(--goldfade);
        color: var(--gold);
      }
      .stat.blue .stat-ic {
        background: var(--bluefade);
        color: var(--blue);
      }
      .stat.red .stat-ic {
        background: var(--redfade);
        color: var(--red);
      }
      .stat.purple .stat-ic {
        background: var(--purplefade);
        color: var(--purple);
      }
      .stat-val {
        font-family: 'Syne';
        font-size: 27px;
        font-weight: 800;
        letter-spacing: -1px;
        line-height: 1;
      }
      .stat-label {
        font-size: 12px;
        color: var(--text2);
        margin-top: 6px;
        font-weight: 500;
      }
      .stat-trend {
        font-size: 11px;
        font-weight: 600;
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .stat-trend.up {
        color: var(--green);
      }
      .stat-trend.down {
        color: var(--red);
      }
      .stat-trend.flat {
        color: var(--text3);
      }

      /* BUTTONS */
      .btn {
        padding: 9px 16px;
        border-radius: 10px;
        border: none;
        font-family: 'DM Sans';
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--teal), var(--teal2));
        color: var(--navy);
        box-shadow: 0 2px 12px rgba(0, 209, 167, 0.25);
      }
      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 18px rgba(0, 209, 167, 0.4);
      }
      .btn-ghost {
        background: var(--card2);
        color: var(--text);
        border: 1px solid var(--border2);
      }
      .btn-ghost:hover {
        background: var(--navy4);
        border-color: var(--text3);
      }
      .btn-sm {
        padding: 6px 12px;
        font-size: 12px;
      }
      .btn-xs {
        padding: 5px 10px;
        font-size: 11px;
        border-radius: 8px;
      }

      /* TWO/THREE COL */
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-bottom: 8px;
      }
      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .grid-12 {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 18px;
      }

      /* PANEL */
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
      }
      .panel-head {
        padding: 15px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .panel-head h3 {
        font-size: 14px;
        font-weight: 700;
      }
      .panel-body {
        padding: 6px 0;
      }

      /* TABLE */
      .trow {
        display: grid;
        padding: 13px 18px;
        align-items: center;
        font-size: 13px;
        border-bottom: 1px solid var(--border);
        transition: all 0.12s;
        position: relative;
        cursor: default;
      }
      .trow:last-child {
        border-bottom: none;
      }
      .trow:hover {
        background: var(--card2);
      }
      .trow:hover.hoverable::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--teal);
      }
      .trow.head {
        background: var(--navy3);
        font-size: 10.5px;
        font-weight: 700;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.6px;
        cursor: default;
      }
      .trow.head:hover {
        background: var(--navy3);
      }
      .t-strong {
        font-weight: 600;
        color: var(--text);
      }
      .t-dim {
        color: var(--text2);
      }
      .t-teal {
        color: var(--teal);
        font-weight: 600;
      }
      .t-gold {
        color: var(--gold);
        font-weight: 600;
      }
      .t-red {
        color: var(--red);
        font-weight: 600;
      }
      .t-mini {
        font-size: 11px;
        color: var(--text3);
      }

      /* CHIPS */
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
      }
      .chip::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .chip.teal {
        background: var(--tealfade);
        color: var(--teal);
      }
      .chip.gold {
        background: var(--goldfade);
        color: var(--gold);
      }
      .chip.red {
        background: var(--redfade);
        color: var(--red);
      }
      .chip.blue {
        background: var(--bluefade);
        color: var(--blue);
      }
      .chip.purple {
        background: var(--purplefade);
        color: var(--purple);
      }
      .chip.plain {
        background: var(--card2);
        color: var(--text2);
      }
      .chip.nodot::before {
        display: none;
      }

      /* PROPERTY CARDS w/ CSS photos */
      .prop-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
      }
      .prop-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        transition: all 0.22s;
        cursor: pointer;
        box-shadow: var(--shadow-sm);
      }
      .prop-card:hover {
        border-color: var(--teal);
        transform: translateY(-3px);
        box-shadow: var(--shadow-lg);
      }
      .prop-photo {
        height: 150px;
        position: relative;
        overflow: hidden;
      }
      .prop-photo .win {
        position: absolute;
        background: linear-gradient(160deg, rgba(255, 240, 200, 0.85), rgba(255, 210, 140, 0.35));
        border-radius: 3px;
      }
      .prop-photo .floor {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 30%;
        background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.25));
      }
      .prop-status {
        position: absolute;
        top: 11px;
        right: 11px;
        z-index: 3;
      }
      .prop-fav {
        position: absolute;
        top: 11px;
        left: 11px;
        z-index: 3;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: rgba(11, 22, 34, 0.6);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .prop-body {
        padding: 15px 16px;
      }
      .prop-name {
        font-family: 'Syne';
        font-size: 14.5px;
        font-weight: 700;
        margin-bottom: 3px;
      }
      .prop-addr {
        font-size: 12px;
        color: var(--text2);
        margin-bottom: 11px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .prop-meta {
        display: flex;
        gap: 14px;
        font-size: 11.5px;
        color: var(--text3);
        margin-bottom: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .prop-meta b {
        color: var(--text2);
        font-weight: 600;
      }
      .prop-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .prop-price {
        font-family: 'Syne';
        font-size: 18px;
        font-weight: 800;
        color: var(--text);
      }
      .prop-price span {
        font-size: 12px;
        color: var(--text3);
        font-weight: 400;
      }
      .prop-margin {
        font-size: 11px;
        color: var(--teal);
        font-weight: 600;
        background: var(--tealfade);
        padding: 4px 9px;
        border-radius: 8px;
      }

      /* SPLIT FLOW (payments) */
      .flow-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        padding: 3px 9px;
        border-radius: 7px;
      }
      .flow-in {
        background: var(--greenfade);
        color: var(--green);
      }
      .flow-out {
        background: var(--bluefade);
        color: var(--blue);
      }

      /* PROGRESS */
      .pbar {
        height: 6px;
        background: var(--navy4);
        border-radius: 4px;
        overflow: hidden;
      }
      .pbar i {
        display: block;
        height: 100%;
        border-radius: 4px;
        background: var(--teal);
        transition: width 0.6s ease;
      }
      .pbar i.gold {
        background: var(--gold);
      }
      .pbar i.red {
        background: var(--red);
      }
      .pbar i.blue {
        background: var(--blue);
      }

      /* SVG MAP */
      .map-wrap {
        background: linear-gradient(160deg, var(--navy3), var(--navy2));
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 0;
        overflow: hidden;
        position: relative;
        box-shadow: var(--shadow-sm);
      }
      .map-legend {
        position: absolute;
        bottom: 14px;
        left: 14px;
        display: flex;
        gap: 14px;
        background: rgba(11, 22, 34, 0.8);
        backdrop-filter: blur(8px);
        padding: 9px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
      }
      .map-leg {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        color: var(--text2);
      }
      .map-leg i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .maptip {
        position: absolute;
        background: var(--navy);
        border: 1px solid var(--border2);
        border-radius: 10px;
        padding: 9px 12px;
        font-size: 12px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
        z-index: 10;
        box-shadow: var(--shadow-lg);
        min-width: 150px;
      }
      .maptip.show {
        opacity: 1;
      }
      .maptip .mt-name {
        font-weight: 700;
        font-size: 12.5px;
        margin-bottom: 3px;
      }
      .maptip .mt-row {
        color: var(--text2);
        font-size: 11px;
      }

      /* FORM */
      .form-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: var(--shadow-sm);
      }
      .form-step {
        font-size: 13px;
        font-weight: 700;
        font-family: 'Syne';
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .form-step .num {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--tealfade);
        color: var(--teal);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }
      .fg {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 13px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field label {
        font-size: 10.5px;
        font-weight: 600;
        color: var(--text2);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .field input,
      .field select,
      .field textarea {
        background: var(--navy);
        border: 1px solid var(--border2);
        border-radius: 9px;
        padding: 10px 12px;
        color: var(--text);
        font-family: 'DM Sans';
        font-size: 13px;
        outline: none;
        transition: border-color 0.15s;
      }
      .field input:focus,
      .field select:focus,
      .field textarea:focus {
        border-color: var(--teal);
      }
      .field input::placeholder {
        color: var(--text3);
      }
      .field select option {
        background: var(--navy2);
      }

      /* ALERT */
      .alert {
        padding: 12px 16px;
        border-radius: 11px;
        font-size: 13px;
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        line-height: 1.5;
      }
      .alert.teal {
        background: var(--tealfade);
        border: 1px solid rgba(0, 209, 167, 0.25);
        color: var(--teal);
      }
      .alert.gold {
        background: var(--goldfade);
        border: 1px solid rgba(255, 201, 77, 0.25);
        color: var(--gold);
      }
      .alert.red {
        background: var(--redfade);
        border: 1px solid rgba(255, 94, 98, 0.25);
        color: var(--red);
      }

      /* MODAL */
      .modal-bg {
        position: fixed;
        inset: 0;
        background: rgba(5, 12, 20, 0.7);
        backdrop-filter: blur(4px);
        z-index: 500;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal-bg.show {
        display: flex;
        animation: fadein 0.2s;
      }
      .modal {
        background: var(--navy2);
        border: 1px solid var(--border2);
        border-radius: var(--radius-lg);
        padding: 26px;
        max-width: 440px;
        width: 100%;
        box-shadow: var(--shadow-lg);
      }
      .modal h3 {
        font-size: 18px;
        font-weight: 800;
        margin-bottom: 8px;
      }
      .modal p {
        font-size: 13.5px;
        color: var(--text2);
        line-height: 1.6;
        margin-bottom: 18px;
      }

      /* INLINE EXPAND */
      .expand {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        background: var(--navy);
        border-radius: 0;
      }
      .expand.open {
        max-height: 240px;
      }
      .expand-inner {
        padding: 14px 18px;
        border-top: 1px dashed var(--border2);
      }

      /* PNL bars */
      .pnl-spark {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 90px;
        padding: 10px 0;
      }
      .pnl-bar {
        flex: 1;
        border-radius: 5px 5px 0 0;
        background: linear-gradient(180deg, var(--teal), var(--teal2));
        position: relative;
        min-height: 8px;
        transition: height 0.5s;
      }
      .pnl-bar.proj {
        background: linear-gradient(180deg, var(--navy4), var(--navy3));
        border: 1px dashed var(--text3);
      }
      .pnl-bar:hover {
        opacity: 0.85;
      }
      .pnl-lbl {
        font-size: 9.5px;
        color: var(--text3);
        text-align: center;
        margin-top: 5px;
      }

      /* RING */
      .ring-wrap {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .ring {
        position: relative;
        width: 120px;
        height: 120px;
        flex-shrink: 0;
      }
      .ring svg {
        transform: rotate(-90deg);
      }
      .ring-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .ring-center .v {
        font-family: 'Syne';
        font-size: 24px;
        font-weight: 800;
      }
      .ring-center .l {
        font-size: 10px;
        color: var(--text3);
      }

      /* BOTTOM TAB (mobile) */
      .bottom-tabs {
        display: none;
      }

      /* RESPONSIVE */
      @media (max-width: 1100px) {
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .prop-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid-12,
        .grid-2 {
          grid-template-columns: 1fr;
        }
        .grid-3 {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 768px) {
        .topnav {
          padding: 12px 14px;
          flex-wrap: wrap;
          gap: 10px;
        }
        .role-tabs {
          order: 3;

        }

          color: var(--teal);

        }

      function initAddForm() {
        let s = 0;
        const tEl = () => document.getElementById('addTimer');
        if (window._addT) clearInterval(window._addT);
        window._addT = setInterval(() => {
          if (!document.getElementById('addTimer')) {
            clearInterval(window._addT);
            return;
          }
          s++;
          const m = Math.floor(s / 60),
            sc = s % 60;
          tEl().textContent = '⏱ ' + m + ':' + (sc < 10 ? '0' : '') + sc;
          if (s > 60) tEl().style.color = 'var(--red)';
        }, 1000);
        const ask = document.getElementById('f_ask'),
          off = document.getElementById('f_offer'),
          ch = document.getElementById('f_charge');
        function calc() {
          const a = +ask.value;
          if (a && !off.dataset.touched) {
            off.value = Math.round(a * 0.76);
          }
          if (a && !ch.dataset.touched) {
            ch.value = a;
          }
          const o = +off.value,
            c = +ch.value;
          const el = document.getElementById('marginCalc');
          if (a && o && c) {
            const margin = c - o,
              disc = Math.round((1 - o / a) * 100);
            el.className = 'alert teal';
            el.innerHTML = `${svg('money', 15)} <div>Oylik foyda: <b>${fmt(margin)}</b> · Egaga chegirma: <b>${disc}%</b> · Yillik foyda: <b>${fmt(margin * 12)}</b></div>`;
          }
        }
        ask.oninput = calc;
        off.oninput = () => {
          off.dataset.touched = 1;
          calc();
        };
        ch.oninput = () => {
          ch.dataset.touched = 1;
          calc();
        };
      }

    <div class="trow head" style="grid-template-columns:1.5fr 1fr 1fr 1.3fr"><span>Obyekt</span><span>Egasi</span><span>Oylik to'lov</span><span>Shartnoma turi</span></div>
    ${DATA.properties.map((p) => `<div class="trow hoverable" style="grid-template-columns:1.5fr 1fr 1fr 1.3fr"><div class="t-strong">${p.name}</div><span class="t-dim">${p.owner}</span><span class="t-teal">${fmt(p.pay)}</span><span class="chip teal nodot">Ishonchli boshqarish</span></div>`).join('')}
  </div></div>`;
      }
      function vTaxDecl() {
        const rented = DATA.properties.filter((p) => p.status === 'rented');
        const rev = sum(rented, (p) => p.charge);
        return `<div class="page-title">Soliq deklaratsiyalari</div><div class="page-sub">Oylik hisobotlar</div>
  <div class="panel"><div class="panel-body">
    <div class="trow head" style="grid-template-columns:1fr 1fr 1fr 1fr 1fr"><span>Davr</span><span>Yalpi daromad</span><span>Stavka</span><span>Soliq</span><span>Holat</span></div>
    ${[
      ['Yan', 0],
      ['Fev', 0],
      ['Mar', 0],
      ['Apr', 0],
      ['May', 2670],
      ['Iyun', rev],
    ]
      .map(
        (r, i) =>
          `<div class="trow" style="grid-template-columns:1fr 1fr 1fr 1fr 1fr"><span class="t-strong">${r[0]} 2025</span><span class="t-dim">${fmt(r[1])}</span><span class="t-dim">4%</span><span class="t-teal">${fmt(Math.round(r[1] * 0.04))}</span><span class="chip ${r[1] ? 'teal' : 'plain'}">${r[1] ? "to'langan" : '—'}</span></div>`,
      )
      .join('')}
  </div></div>`;
      }

      // ============ SVG TASHKENT MAP ============
      function vMapInit() {}
      function initMap() {
        const wrap = document.getElementById('mapWrap');
        if (!wrap) return;
        const districts = [
          { n: 'Uchtepa', x: 150, y: 140, w: 130, h: 90 },
          { n: 'Shaykhontohur', x: 300, y: 130, w: 120, h: 90 },
          { n: "Mirzo Ulug'bek", x: 380, y: 110, w: 150, h: 100 },
          { n: 'Yunusobod', x: 500, y: 50, w: 160, h: 110 },
          { n: 'Yashnobod', x: 540, y: 200, w: 140, h: 110 },
          { n: 'Chilonzor', x: 220, y: 200, w: 140, h: 110 },
          { n: 'Sergeli', x: 280, y: 300, w: 160, h: 90 },
        ];
        let svgStr = `<svg viewBox="0 0 720 420" width="100%" height="100%" style="display:block">`;
        // district zones
        districts.forEach((d) => {
          svgStr += `<rect x="${d.x}" y="${d.y}" width="${d.w}" height="${d.h}" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>`;
          svgStr += `<text x="${d.x + 12}" y="${d.y + 22}" fill="#5C748F" font-size="11" font-family="DM Sans" font-weight="600">${d.n}</text>`;
        });
        // roads
        svgStr += `<path d="M0 180 L720 200" stroke="rgba(255,255,255,0.04)" stroke-width="3"/><path d="M360 0 L380 420" stroke="rgba(255,255,255,0.04)" stroke-width="3"/>`;
        // pins
        DATA.properties.forEach((p) => {
          const col =
            p.status === 'rented' ? '#00D1A7' : p.status === 'vacant' ? '#FFC94D' : '#FF5E62';
          svgStr += `<g class="map-pin-g" data-id="${p.id}" style="cursor:pointer">
      <circle cx="${p.mapX}" cy="${p.mapY}" r="14" fill="${col}" opacity="0.18"/>
      <circle cx="${p.mapX}" cy="${p.mapY}" r="7" fill="${col}" stroke="#0B1622" stroke-width="2"/>
    </g>`;
        });
        svgStr += `</svg>`;
        wrap.innerHTML =
          svgStr +
          `<div class="map-legend"><div class="map-leg"><i style="background:#00D1A7"></i>Ijarada</div><div class="map-leg"><i style="background:#FFC94D"></i>Bo'sh</div><div class="map-leg"><i style="background:#FF5E62"></i>Ta'mirda</div></div><div class="maptip" id="maptip"></div>`;
        // hover
        wrap.querySelectorAll('.map-pin-g').forEach((g) => {
          g.addEventListener('mouseenter', (e) => {
            const p = DATA.properties.find((x) => x.id == g.dataset.id);
            const tip = document.getElementById('maptip');
            tip.innerHTML = `<div class="mt-name">${p.name}</div><div class="mt-row">${p.tenant ? p.nat + ' ' + p.tenant : "Bo'sh — tayyor"}</div><div class="mt-row" style="color:var(--teal)">${fmt(p.charge - p.pay)}/oy foyda</div>`;
            const r = g.getBoundingClientRect(),
              wr = wrap.getBoundingClientRect();
            tip.style.left = r.left - wr.left + 15 + 'px';
            tip.style.top = r.top - wr.top - 10 + 'px';
            tip.classList.add('show');
          });
          g.addEventListener('mouseleave', () =>
            document.getElementById('maptip').classList.remove('show'),
          );
          g.addEventListener('click', () => openPropModal(+g.dataset.id));
        });
      }

      function okModal(title, msg) {
        openModal(
          '<div style="text-align:center"><div style="width:56px;height:56px;border-radius:50%;background:var(--tealfade);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--teal)">' +
            svg('check', 28) +
            '</div><h3>' +
            title +
            '</h3><p>' +
            msg +
            '</p><button class="btn btn-primary" style="width:100%;justify-content:center" onclick="closeModal()">OK</button></div>',
        );
      }
      function payOk(amt) {
        okModal(
          "To'lov tasdiqlandi",
          '$' +
            amt.toLocaleString() +
            " muvaffaqiyatli to'landi. Kvitansiya emailingizga yuborildi.",
        );
      }
      function serviceOk() {
        okModal("So'rov yuborildi", "Texnigimiz 4 soat ichida siz bilan bog'lanadi.");
      }
      function viewBooked() {
        okModal("Ko'rish belgilandi", "Operatorimiz siz bilan bog'lanib, qulay vaqtni kelishadi.");
      }

      // ============ INIT ============
      renderTabs();
      renderSidebar();
      renderBottom();
      renderContent();
    </script>
  </body>
</html>
